<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Login — SigraFilm NOC</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-bg">

  <div class="login-box">
    <!-- Logo -->
    <div class="text-center mb-3">
      <a href="https://sigrafilm.com/" target="_blank">
        <img src="{{ url_for('static', filename='logo_sigra.png') }}" alt="SigraFilm" height="60">
      </a>
    </div>

    <div class="login-noc-label">Network Operations Center</div>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="alert alert-{{ category }} py-2">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="nome.utente" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100"
        style="padding:.6rem; font-size:.88rem; letter-spacing:.06em; font-weight:600;">
        Accedi
      </button>
    </form>

    <!-- Richiesta credenziali via WhatsApp -->
    <div style="display:flex; align-items:center; gap:.75rem; margin:1.6rem 0 1.1rem;">
      <div style="flex:1; height:1px; background:var(--border);"></div>
      <span style="font-size:.68rem; color:var(--text-3); letter-spacing:.08em;">
        NON HAI LE CREDENZIALI?
      </span>
      <div style="flex:1; height:1px; background:var(--border);"></div>
    </div>

    <a href="https://wa.me/390552691489?text={{ 'Buongiorno, sono il cinema ___ e vorrei le credenziali per accedere al NOC SigraFilm.' | urlencode }}"
       target="_blank" rel="noopener"
       class="btn w-100 d-flex align-items-center justify-content-center gap-2"
       style="padding:.6rem; font-size:.85rem; font-weight:600;
              background:#25D366; border:1px solid #25D366; color:#0b2e18;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.08-.3-.15-1.25-.46-2.39-1.47-.88-.79-1.48-1.76-1.65-2.06-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.06 2.88 1.21 3.08c.15.2 2.09 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35z"/>
        <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2 22l5.25-1.38a9.87 9.87 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.13h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.11.82.83-3.04-.2-.31a8.18 8.18 0 0 1-1.26-4.36c0-4.54 3.7-8.24 8.24-8.24a8.19 8.19 0 0 1 8.23 8.25c0 4.54-3.7 8.24-8.24 8.24z"/>
      </svg>
      Scrivici su WhatsApp
    </a>

    <div style="text-align:center; font-size:.7rem; color:var(--text-3); margin-top:.7rem;">
      Oppure chiama il <a href="tel:+39055290746" style="color:var(--cyan); text-decoration:none;">055 290746</a>
    </div>
  </div>

</body>
</html>
